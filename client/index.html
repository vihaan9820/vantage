<!doctype html>
<html lang="en" class="dark" data-skillswap-theme="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Primary Metadata -->
    <title>Vantage — Peer-to-Peer Knowledge Barter Platform</title>
    <meta name="description" content="Vantage is a reciprocal peer-to-peer knowledge barter platform. Trade your skills 1-on-1 with verified creators and engineers without exchanging money." />
    <meta name="keywords" content="vantage, skill barter, peer-to-peer learning, knowledge barter, timebank, skill exchange, mentorship, reciprocal learning" />
    <link rel="canonical" href="https://vantage.io/" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vantage" />
    
    <!-- Preload Megiko Luxury Editorial Brand Font -->
    <link rel="preload" href="/fonts/Megiko.otf" as="font" type="font/otf" crossorigin />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vantage" />
    <meta property="og:url" content="https://vantage.io/" />
    <meta property="og:title" content="Vantage — Peer-to-Peer Knowledge Barter Platform" />
    <meta property="og:description" content="Trade your skills 1-on-1 with verified creators, developers, and designers. Zero money involved. Mutual compatibility matching and TimeBank credits escrow." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vantage — Trade Your Skills, Master Anything" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://vantage.io/" />
    <meta name="twitter:title" content="Vantage — Peer-to-Peer Knowledge Barter Platform" />
    <meta name="twitter:description" content="Trade your skills 1-on-1 with verified creators, developers, and designers. Zero money involved." />
    <meta name="twitter:image" content="https://vantage.io/og-image.svg" />
    <meta name="twitter:image:alt" content="Vantage Platform Preview" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://vantage.io/#organization",
          "name": "Vantage",
          "url": "https://vantage.io",
          "logo": "https://vantage.io/favicon.svg",
          "description": "Peer-to-peer knowledge barter and collaborative learning platform without fiat transactions.",
          "knowsAbout": ["Skill Barter", "Reciprocal Learning", "TimeBank Escrow", "Peer Mentorship"]
        },
        {
          "@type": "WebSite",
          "@id": "https://vantage.io/#website",
          "url": "https://vantage.io",
          "name": "Vantage",
          "description": "Peer-to-peer knowledge barter platform",
          "publisher": { "@id": "https://vantage.io/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://vantage.io/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
